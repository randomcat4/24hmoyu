[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "24hmoyu"
version = "0.2.0"
description = "Privacy-first work-data collectors with local recall and long-term memory consolidation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "24hmoyu contributors"}]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
24hmoyu = "twentyfour_myself.cli:main"
24hmyself = "twentyfour_myself.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twentyfour_myself"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
